name: dynavia
description: "Sistema de Gestión de Emergencias para Ambulancias - Dynavia"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  lottie: ^3.1.2
  flutter_bloc: ^8.1.6
  gap: ^3.0.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: assets/icons/dynavia_icon.png
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: assets/icons/dynavia_icon.png
